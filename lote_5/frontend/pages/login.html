    <div class="login-panel-contenido">
      <p class="login-panel-etiqueta">Bienvenido a</p>
      <h1 class="login-panel-titulo">Sistema de Incidencias de Laboratorio</h1>
      <p class="login-panel-sub">Reporta fallas, haz seguimiento en tiempo real y resuélvelas desde un solo lugar.</p>
    </div>
    <span class="login-panel-pie">Campus Chiclayo</span>
  </aside>

  <main class="login-panel-formulario">
    <section class="login-tarjeta">
      <header class="login-marca">
        <!-- Para usar el logo oficial, coloca ../assets/logo-ucv.svg (o .png): reemplaza este logo automaticamente. -->
        <div class="login-logo" id="logo-ucv">
          <svg viewBox="0 0 300 64" role="img" aria-label="Universidad César Vallejo">
            <path d="M4 4h46v30c0 13-9 21-23 26C13 55 4 47 4 34Z" fill="#d6101f"/>
            <path d="M12 12h30M12 20h30M12 28h30" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".95"/>
            <path d="M27 34v18" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
            <text x="60" y="38" font-family="Sora, Inter, sans-serif" font-weight="700" font-size="14" fill="#16305c" textLength="236" lengthAdjust="spacingAndGlyphs">UNIVERSIDAD CÉSAR VALLEJO</text>
          </svg>
        </div>
      </header>

      <div id="contenedor-login"></div>

      <footer class="login-pie-pagina">
        <a href="#" data-info="Escríbenos a soporte para recibir ayuda con tu acceso.">Ayuda</a>
        <a href="#" data-info="Tus datos se usan solo para gestionar incidencias de laboratorio.">Privacidad</a>
        <span>© 2026 Universidad César Vallejo</span>
      </footer>
    </section>
  </main>

  <script type="module">
    import { LoginController } from "../js/controllers/LoginController.js";
    import { Toast } from "../js/components/Toast.js";

    // Si colocas el logo oficial en ../assets/logo-ucv.svg (o .png), reemplaza al logo de respaldo.
    for (const ruta of ["../assets/logo-ucv.svg", "../assets/logo-ucv.png"]) {
      const img = new Image();
      img.alt = "Universidad César Vallejo";
      img.onload = () => {
        const cont = document.getElementById("logo-ucv");
        if (!cont.dataset.oficial) { cont.dataset.oficial = "1"; cont.replaceChildren(img); }
      };
      img.src = ruta;
    }

    document.querySelectorAll("[data-info]").forEach((a) =>
      a.addEventListener("click", (e) => { e.preventDefault(); Toast.info(a.dataset.info); }));

    new LoginController(document.getElementById("contenedor-login"));
  </script>
